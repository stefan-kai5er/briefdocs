<!--
  Quelle fuer public/og-default.png. Nach Aenderungen neu rendern:
    rsvg-convert -w 1200 -h 630 -o public/og-default.png scripts/og-image.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14161c"/>
      <stop offset="100%" stop-color="#20242e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="8" fill="#4f7cff"/>
  <text x="80" y="255" font-family="DejaVu Sans" font-size="92" font-weight="bold" fill="#ffffff">Briefdocs</text>
  <text x="80" y="335" font-family="DejaVu Sans" font-size="34" fill="#9aa4bf">Kurze Notizen, Snippets und Anleitungen.</text>
  <text x="80" y="391" font-family="DejaVu Sans" font-size="34" fill="#9aa4bf">Für mich dokumentiert, für alle offen.</text>
  <text x="80" y="551" font-family="DejaVu Sans" font-size="30" fill="#4f7cff">briefdocs.org</text>
</svg>
